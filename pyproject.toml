[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai_mcp_chat"
version = "1.0.0"
description = "AI Chat interface with MCP support for Frappe"
authors = [
    {name = "Pankaj Mathur", email = "your.email@example.com"}
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "python-socketio>=5.9.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0"
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/pankajxmathur/ai_chat"
Repository = "https://github.com/pankajxmathur/ai_chat"

[tool.bench.dev-dependencies]
